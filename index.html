<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子書庫 - E-Book Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 基础变量 ===== */
        :root {
            --bg-primary: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #0f0f23 100%);
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #e8e8e8;
            --text-secondary: #8b8b9a;
            --text-muted: #5a5a6e;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        [data-theme="light"] {
            --bg-primary: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 50%, #f5f7fa 100%);
            --bg-card: #ffffff;
            --bg-card-hover: #f8f9fa;
            --text-primary: #1a1a2e;
            --text-secondary: #5a5a6e;
            --text-muted: #8b8b9a;
            --accent: #2980b9;
            --accent-hover: #1a5276;
            --border: rgba(0, 0, 0, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }
        
        /* ===== 基础样式 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Serif SC', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        a { color: inherit; text-decoration: none; }
        
        /* ===== 顶部导航 ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(15, 15, 35, 0.9);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }
        
        [data-theme="light"] .header {
            background: rgba(255, 255, 255, 0.9);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        
        .logo-icon { font-size: 28px; }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
        }
        
        .theme-btn:hover {
            background: var(--bg-card-hover);
            transform: scale(1.05);
        }
        
        /* ===== 主内容区 ===== */
        .main {
            padding: 100px 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* ===== 搜索和筛选 ===== */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .search-box {
            flex: 1;
            max-width: 500px;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            transition: var(--transition);
        }
        
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }
        
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            opacity: 0.6;
        }
        
        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .filter-tab {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text-secondary);
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .filter-tab:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        
        .filter-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        
        /* ===== 统计信息 ===== */
        .stats {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* ===== 书籍网格 ===== */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }
        
        .book-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .book-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--cover-color, var(--accent));
            opacity: 0;
            transition: var(--transition);
        }
        
        .book-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }
        
        .book-card:hover::before {
            opacity: 1;
        }
        
        .book-header {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .book-cover {
            width: 80px;
            height: 110px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            flex-shrink: 0;
        }
        
        .book-info {
            flex: 1;
            min-width: 0;
        }
        
        .book-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .book-author {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .book-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .book-tag {
            font-size: 12px;
            padding: 4px 10px;
            background: rgba(52, 152, 219, 0.15);
            color: var(--accent);
            border-radius: 12px;
        }
        
        .book-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .book-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        
        .book-stats {
            font-size: 13px;
            color: var(--text-muted);
        }
        
        .book-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 500;
        }
        
        .book-status.completed {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
        }
        
        .book-status.writing {
            background: rgba(241, 196, 15, 0.15);
            color: #f1c40f;
        }
        
        .book-status.planning {
            background: rgba(149, 165, 166, 0.15);
            color: #95a5a6;
        }
        
        .book-action {
            font-size: 13px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        
        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .empty-text {
            font-size: 18px;
            margin-bottom: 8px;
        }
        
        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 14px;
            border-top: 1px solid var(--border);
            margin-top: 60px;
        }
        
        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .header {
                padding: 0 20px;
            }
            
            .main {
                padding: 90px 20px 40px;
            }
            
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                max-width: none;
            }
            
            .filter-tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 8px;
            }
            
            .books-grid {
                grid-template-columns: 1fr;
            }
            
            .stats {
                gap: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="logo">
            <span class="logo-icon">📚</span>
            <span class="logo-text">電子書庫</span>
        </div>
        <div class="header-actions">
            <button class="theme-btn" onclick="toggleTheme()" title="切換主題">◐</button>
        </div>
    </header>
    
    <!-- 主内容 -->
    <main class="main">
        <!-- 统计 -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-value" id="totalBooks">0</span>
                <span class="stat-label">书籍总数</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="totalChapters">0</span>
                <span class="stat-label">章节总数</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="totalWords">0</span>
                <span class="stat-label">总字数</span>
            </div>
        </div>
        
        <!-- 搜索和筛选 -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索书名、作者、标签..." oninput="handleSearch()">
            </div>
            <div class="filter-tabs" id="filterTabs">
                <button class="filter-tab active" data-category="all" onclick="filterByCategory('all')">全部</button>
                <!-- 分类将通过 JS 动态生成 -->
            </div>
        </div>
        
        <!-- 书籍列表 -->
        <div class="books-grid" id="booksGrid">
            <!-- 书籍卡片将通过 JS 动态生成 -->
        </div>
        
        <!-- 空状态 -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">📭</div>
            <div class="empty-text">没有找到匹配的书籍</div>
            <div class="empty-hint">试试调整搜索条件</div>
        </div>
    </main>
    
    <!-- 页脚 -->
    <footer class="footer">
        <p>電子書庫 · 持续更新中</p>
    </footer>
    
    <!-- 脚本 -->
    <script src="./js/books-config.js"></script>
    <script>
        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            loadCategories();
            renderBooks();
            updateStats();
        });
        
        // ===== 主题 =====
        function initTheme() {
            const saved = localStorage.getItem('library_theme') || 'dark';
            setTheme(saved);
        }
        
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('library_theme', theme);
            
            const btn = document.querySelector('.theme-btn');
            if (btn) btn.textContent = theme === 'light' ? '🌙' : '◐';
        }
        
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'light' ? 'dark' : 'light');
        }
        
        // ===== 加载分类 =====
        function loadCategories() {
            const tabs = document.getElementById('filterTabs');
            const categories = getCategories();
            
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-tab';
                btn.dataset.category = cat;
                btn.textContent = cat;
                btn.onclick = () => filterByCategory(cat);
                tabs.appendChild(btn);
            });
        }
        
        // ===== 筛选 =====
        let currentCategory = 'all';
        let currentSearch = '';
        
        function filterByCategory(category) {
            currentCategory = category;
            
            // 更新标签状态
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.category === category);
            });
            
            renderBooks();
        }
        
        function handleSearch() {
            currentSearch = document.getElementById('searchInput').value;
            renderBooks();
        }
        
        // ===== 渲染书籍 =====
        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            const empty = document.getElementById('emptyState');
            
            const books = getBooks({
                category: currentCategory,
                search: currentSearch,
                status: 'all'
            });
            
            if (books.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            
            empty.style.display = 'none';
            grid.innerHTML = books.map(book => createBookCard(book)).join('');
            
            // 更新统计
            updateStats();
        }
        
        function createBookCard(book) {
            const statusText = {
                'completed': '已完成',
                'writing': '创作中',
                'planning': '规划中'
            };
            
            return `
                <div class="book-card" onclick="openBook('${book.id}')" style="--cover-color: ${book.coverColor || '#3498db'}">
                    <div class="book-header">
                        <div class="book-cover" style="background: ${book.coverColor || 'linear-gradient(145deg, #3498db 0%, #2980b9 100%)'}">
                            ${book.cover || '📖'}
                        </div>
                        <div class="book-info">
                            <h3 class="book-title">${book.title}</h3>
                            <p class="book-author">${book.author}</p>
                            <div class="book-meta">
                                <span class="book-tag">${book.category}</span>
                                ${book.tags ? book.tags.slice(0, 2).map(t => `<span class="book-tag">${t}</span>`).join('') : ''}
                            </div>
                        </div>
                    </div>
                    <p class="book-desc">${book.description || ''}</p>
                    <div class="book-footer">
                        <span class="book-stats">${book.chapters}章 · ${book.words}</span>
                        <span class="book-status ${book.status}">${statusText[book.status] || book.status}</span>
                    </div>
                </div>
            `;
        }
        
        // ===== 打开书籍 =====
        function openBook(bookId) {
            const book = getBook(bookId);
            if (book && book.readerPath) {
                window.location.href = book.readerPath;
            }
        }
        
        // ===== 统计 =====
        function updateStats() {
            const books = getBooks({ status: 'all' });
            
            document.getElementById('totalBooks').textContent = books.length;
            
            const totalChapters = books.reduce((sum, b) => sum + (b.chapters || 0), 0);
            document.getElementById('totalChapters').textContent = totalChapters;
            
            // 估算总字数（从 words 字段提取数字）
            let totalWords = 0;
            books.forEach(b => {
                if (b.words) {
                    const match = b.words.match(/(\d+)/);
                    if (match) totalWords += parseInt(match[1]) * 10000;
                }
            });
            document.getElementById('totalWords').textContent = totalWords > 0 ? Math.round(totalWords / 10000) + '万+' : '0';
        }
    </script>
</body>
</html>
