<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子書庫 - E-Book Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/library.css">
</head>
<body>
    <div class="library-container">
        <header class="library-header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">📚</span>
                    <span class="logo-text">電子書庫</span>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" onclick="toggleTheme()" title="切換主題">
                        <span class="theme-icon">🌙</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="library-main">
            <div class="welcome-section">
                <h1 class="welcome-title">我的書架</h1>
                <p class="welcome-subtitle">My E-Book Library</p>
            </div>

            <!-- 书籍分类 -->
            <div class="category-tabs" id="categoryTabs">
                <button class="tab-btn active" data-category="all">全部</button>
                <button class="tab-btn" data-category="reading">閱讀中</button>
                <button class="tab-btn" data-category="finished">已完成</button>
                <button class="tab-btn" data-category="to-read">待閱讀</button>
            </div>

            <!-- 书籍网格 -->
            <div class="bookshelf" id="bookshelf">
                <!-- 书籍将通过 JavaScript 动态加载 -->
            </div>

            <!-- 空状态提示 -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">📚</div>
                <h3>還沒有書籍</h3>
                <p>添加新書後，它們會顯示在這裡</p>
            </div>
        </main>

        <footer class="library-footer">
            <p>點擊書籍封面開始閱讀 · 支持 Markdown 和 EPUB 格式</p>
            <p class="footer-links">
                <a href="./cover.html" class="footer-link">📖 大棋局 2 封面</a>
                <span class="footer-divider">|</span>
                <a href="./reader.html" class="footer-link">📖 直接閱讀</a>
            </p>
        </footer>
    </div>

    <script src="./js/books-config.js"></script>
    <script src="./js/library.js"></script>
</body>
</html>
