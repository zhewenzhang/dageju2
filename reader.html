<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>閱讀器 - E-Book Reader</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/reader.css">
</head>
<body>
    <!-- 顶部工具栏 -->
    <header class="reader-header">
        <div class="header-left">
            <button class="header-btn back-btn" onclick="goBack()" title="返回書庫">
                ←
            </button>
            <button class="header-btn menu-btn" onclick="toggleSidebar()" title="目錄">
                ☰
            </button>
            <div class="book-title">
                <span id="bookTitle">大棋局</span><span class="num">2</span>
            </div>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="toggleFontSize()" title="調整字體大小">
                <span id="fontSizeIcon">A</span>
            </button>
            <button class="header-btn" onclick="toggleTheme()" title="切換主題">
                <span id="themeIcon">🌙</span>
            </button>
            <button class="header-btn" onclick="toggleScrollMode()" title="切換閱讀模式">
                <span id="modeIcon">📜</span>
            </button>
        </div>
    </header>

    <!-- 进度条 -->
    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- 侧边目录 -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>📖 目錄</h3>
            <button class="close-btn" onclick="toggleSidebar()">×</button>
        </div>
        <div class="chapter-list" id="chapterList">
            <!-- 章节列表将动态加载 -->
        </div>
    </aside>

    <!-- 主阅读区 -->
    <main class="reader-main" id="readerMain">
        <div class="pages-container" id="pagesContainer">
            <!-- 页面将动态加载 -->
        </div>
    </main>

    <!-- 翻页按钮 -->
    <div class="page-nav-buttons" id="pageNavButtons">
        <button class="nav-btn prev-btn" onclick="prevPage()" id="prevBtn" disabled>
            <span>←</span>
            <span class="btn-text">上一頁</span>
        </button>
        <button class="nav-btn next-btn" onclick="nextPage()" id="nextBtn">
            <span class="btn-text">下一頁</span>
            <span>→</span>
        </button>
    </div>

    <!-- 阅读模式提示 -->
    <div class="mode-toast" id="modeToast">
        <span id="modeToastText">翻頁模式</span>
    </div>

    <!-- 引入书籍配置 -->
    <script src="./js/dageju2-config.js?v=20250405"></script>
    <!-- 引入阅读器脚本 -->
    <script src="./js/reader.js?v=20250405"></script>
</body>
</html>
